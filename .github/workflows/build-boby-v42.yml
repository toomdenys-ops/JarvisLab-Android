name: BOBY V4.2 • Rosto expressivo e chat limpo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'BobyLab_Autonomo_V4_2_Emocoes_ChatLimpo.zip'

permissions:
  contents: read

jobs:
  apk:
    name: Compilar APK Boby V4.2
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair projeto Boby V4.2
        shell: bash
        run: |
          test -f BobyLab_Autonomo_V4_2_Emocoes_ChatLimpo.zip
          unzip -oq BobyLab_Autonomo_V4_2_Emocoes_ChatLimpo.zip -d .
          test -f app/src/main/assets/index.html
          grep -q 'versionName = "4.2-boby-expressions"' app/build.gradle.kts

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar NDK e ferramentas
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y -qq ninja-build glslang-tools glslc python3

      - name: Preparar llama.kt para Qwen
        shell: bash
        run: |
          mkdir -p libs
          git clone --depth 1 https://github.com/tensai-app/llama.kt.git libs/llama.kt
          git -C libs/llama.kt submodule update --init --recursive
          bash libs/llama.kt/scripts/bootstrap.sh
          bash libs/llama.kt/scripts/build-opencl.sh
          python3 - <<'PYCODE'
          from pathlib import Path
          cmake = Path('libs/llama.kt/llama-kt/src/main/cpp/CMakeLists.txt')
          source = cmake.read_text()
          old = '-march=armv8.2-a+dotprod'
          if source.count(old) != 1:
              raise SystemExit('Configuração ARM inesperada')
          cmake.write_text(source.replace(old, '-march=armv8-a'))
          gradle = Path('libs/llama.kt/llama-kt/build.gradle.kts')
          source = gradle.read_text()
          old = 'plugins { id("com.android.library") }'
          new = '''plugins {
              id("com.android.library")
              id("org.jetbrains.kotlin.android")
          }'''
          if old in source:
              gradle.write_text(source.replace(old, new, 1))
          elif 'id("org.jetbrains.kotlin.android")' not in source:
              raise SystemExit('Não foi possível configurar o plugin Kotlin')
          PYCODE

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar Boby V4.2
        shell: bash
        run: gradle --no-daemon --max-workers=2 :app:assembleDebug
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: BobyLab-V4.2-Emocoes-Chat-Limpo-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
